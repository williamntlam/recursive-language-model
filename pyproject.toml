[project]
name = "recursive-language-model"
version = "0.1.0"
description = "Inference-time Recursive Language Model: Docker REPL, OpenAI, no context rot."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "William Lam" }]
license = { text = "MIT" }
dependencies = [
    "docker>=7.1",
    "openai>=1.50",
    "pyyaml>=6.0",
    "tiktoken>=0.8",
]

[project.optional-dependencies]
pdf = ["pypdf>=5.0"]

[project.scripts]
rlm = "rlm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rlm"]

[tool.hatch.build.targets.wheel.force-include]
"rlm/prompts" = "rlm/prompts"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: runs against a running Docker daemon",
    "eval_support: validates opt-in evaluation cases, judges, or benchmark helpers",
    "harbor: validates Harbor task assets and deterministic verifiers",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
